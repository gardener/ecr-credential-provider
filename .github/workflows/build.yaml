name: Build

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
        default: snapshot
        description: |
          the mode to use. either `snapshot` or `release`. Will affect effective version, as well
          as target-oci-registry.

jobs:
  upstream-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.upstream.outputs.version }}
      commit: ${{ steps.upstream.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test upstream intake
        run: python3 -B .ci/tests/test_upstream.py -v
      - name: Verify and check out upstream release
        id: upstream
        env:
          MODE: ${{ inputs.mode }}
        run: python3 .ci/upstream.py prepare --mode "$MODE" --checkout upstream --output "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Analyze the shipped upstream packages
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          python3 .ci/sast.py --source upstream --report blobs.d/gosec-report.sarif
      - name: Export upstream provenance and analysis report
        uses: gardener/cc-utils/.github/actions/export-ocm-fragments@v1
        with:
          ocm-sources-file: .ocm/upstream-source.json
          blobs-directory: blobs.d
          ocm-resources: |
            name: gosec-report
            type: sarif
            relation: local
            access:
              type: localBlob
              localReference: gosec-report.sarif
              mediaType: application/sarif+json
            srcRefs:
              - identitySelector:
                  name: cloud-provider-aws
            labels:
              - name: gardener.cloud/purposes
                value: [lint, sast, gosec]
              - name: gardener.cloud/comment
                value: gosec analysis of first-party packages compiled into the Linux credential provider; excludes tests and third-party dependencies.

  prepare:
    needs:
      - upstream-source
    uses: gardener/cc-utils/.github/workflows/prepare.yaml@v1
    with:
      mode: ${{ inputs.mode }}
    permissions:
      id-token: write

  oci-images:
    name: Build OCI-Images
    needs:
      - prepare
      - upstream-source
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
    uses: gardener/cc-utils/.github/workflows/oci-ocm.yaml@v1
    strategy:
      matrix:
        args:
          - name: ecr-credential-provider
            target:
            oci-repository: gardener/extensions/ecr-credential-provider
    with:
      name: ${{ matrix.args.name }}
      version: ${{ needs.prepare.outputs.version }}
      target: ${{ matrix.args.target }}
      oci-registry: ${{ needs.prepare.outputs.oci-registry }}
      oci-repository: ${{ matrix.args.oci-repository }}
      oci-platforms: linux/amd64,linux/arm64
      extra-tags:
      build-args: |
        UPSTREAM_VERSION=${{ needs.upstream-source.outputs.version }}
        UPSTREAM_COMMIT=${{ needs.upstream-source.outputs.commit }}
