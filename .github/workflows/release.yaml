name: Release
on:
  workflow_dispatch:
    inputs:
      next-version:
        type: choice
        options:
          - bump-minor
          - bump-patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard-ref:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check release ref
        shell: bash
        run: |
          case "${GITHUB_REF}" in
            refs/heads/master|refs/heads/release-*) ;;
            *) echo "ERROR: release must be dispatched from master or a release-* branch, got ${GITHUB_REF}"; exit 1 ;;
          esac

  build:
    needs: guard-ref
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      mode: release

  release-to-github-and-bump:
    uses: gardener/cc-utils/.github/workflows/release.yaml@v1
    needs:
      - build
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      release-commit-target: branch
      next-version: ${{ inputs.next-version }}
